[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trueup"
version = "0.1.0"
description = "Payments reconciliation measured against a known answer key"
requires-python = ">=3.11"
# fastapi and sqlglot are runtime dependencies because Vercel installs from pyproject.toml when it exists
dependencies = ["duckdb>=1.0", "fastapi>=0.110", "sqlglot>=25"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "sqlglot>=25"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "dbt-duckdb>=1.8", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "sqlglot>=25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the engine is SQL in strings; wrapping it would hurt readability
"src/trueup/recon/engine.py" = ["E501"]
"src/trueup/ask/planner.py" = ["E501"]
"src/trueup/ask/evalset.py" = ["E501"]
"src/trueup/ask/redteam.py" = ["E501"]
"src/trueup/api/app.py" = ["E501", "E702", "E701"]
"src/trueup/api/network.py" = ["E501"]
"src/trueup/api/queries.py" = ["E501"]
"src/trueup/ask/schema.py" = ["E501"]
"src/trueup/ask/provider.py" = ["E501"]
"src/trueup/ask/service.py" = ["E501"]
