# One command: docker compose up --build   then open http://localhost:3000
services:
  api:
    build: .
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      retries: 20
  web:
    build:
      context: ./dashboard
      args:
        TALLY_API: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
