name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest
      - name: Accuracy regression gate (easy and hard profiles)
        run: python -m tally check
      - name: Smoke test the generator
        run: python -m tally generate --seed 1 --days 5 --out data/smoke

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit
      - run: pip-audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up --build -d --wait
      - name: Smoke test through the dashboard proxy
        run: |
          curl -sf localhost:3000/api/health
          curl -sf localhost:3000/api/overview | grep -q open_errors
          curl -sf localhost:3000/exceptions >/dev/null
      - if: failure()
        run: docker compose logs
